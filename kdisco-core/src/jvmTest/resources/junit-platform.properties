# Preemptive per-test timeout (kdisco#86). The slowest existing jvm test takes ~6 s, so 60 s
# is comfortably above it yet stops a spinning test long before the CI job limit.
junit.jupiter.execution.timeout.default=60s
# Only SEPARATE_THREAD can fail a test body that spins without ever suspending.
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD
# Registers TimeoutDiagnosticsExtension through META-INF/services.
junit.jupiter.extensions.autodetection.enabled=true
