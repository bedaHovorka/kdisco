name: Gradle CI

on:
  push:
    # Deliberately narrow. Every other branch pattern reaches CI through the
    # `pull_request` trigger, so listing it here too would run the whole workflow
    # twice for one push. `feat/**` is the exception: `publish-snapshot` needs a
    # push-triggered `build` to publish the snapshot consumers depend on.
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, develop, 'toVer0.6.0', 'feat/**']
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v3
      - name: Static analysis (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt
      - run: ./gradlew build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: kdisco-artifacts
          path: '**/build/libs/*.jar'
          retention-days: 30

  publish-snapshot:
    name: Publish Snapshot to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feat/'))) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Analyse a pull request from this repository (forks do not get the SONAR_TOKEN
    # secret, so skip rather than fail), or trunk. A push to `feat/**` is here only to
    # publish a snapshot; the free plan discards non-trunk branch analyses anyway, and
    # the branch's pull request already covers it.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history for accurate blame / new-code attribution.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The Sonar scanner requires Java 17+; the Kotlin jvmTarget stays at 11.
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Determine analysis scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # These values end up in a shell word. Git permits backtick, dollar,
          # parenthesis and semicolon in a ref name, so validate fail-closed.
          check_ref() {
            case "$2" in
              *[!A-Za-z0-9._/+,-]* | "")
                echo "::error::Refusing to build a Sonar scope from an unexpected $1."
                exit 1
                ;;
            esac
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            case "$PR_NUMBER" in
              '' | *[!0-9]*)
                echo "::error::Pull request number is not numeric."
                exit 1
                ;;
            esac
            check_ref "pull request head ref" "$PR_HEAD_REF"
            check_ref "pull request base ref" "$PR_BASE_REF"
            # Scope the run to the pull request. Without this it silently overwrites
            # the trunk analysis. `qualitygate.wait` makes a red gate fail the job.
            ARGS="-Dsonar.pullrequest.key=${PR_NUMBER}"
            ARGS="$ARGS -Dsonar.pullrequest.branch=${PR_HEAD_REF}"
            ARGS="$ARGS -Dsonar.pullrequest.base=${PR_BASE_REF}"
            ARGS="$ARGS -Dsonar.qualitygate.wait=true"
          elif [ -n "${GITHUB_REF_NAME:-}" ]; then
            check_ref "branch name" "$GITHUB_REF_NAME"
            ARGS="-Dsonar.branch.name=${GITHUB_REF_NAME}"
          else
            echo "::error::Could not determine a Sonar analysis scope (neither a pull request nor a branch name)."
            exit 1
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: Coverage report and Sonar analysis
        # `$SONAR_ARGS` is read from the environment, never interpolated into the
        # script body: `${{ }}` there would splice ref-derived text into the shell.
        run: ./gradlew koverXmlReport sonar $SONAR_ARGS
        env:
          SONAR_ARGS: ${{ steps.scope.outputs.args }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/kover/report.xml
          retention-days: 30
